name: Release bundle

# Build the desktop bundle (AppImage + .deb) and package the matching firmware on a version tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build runs with a read-only token. Only the small `publish` job below, which runs no project code and
# installs nothing, gets `contents: write` to attach the files to the release.
permissions:
  contents: read

jobs:
  bundle:
    name: Desktop bundle (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Rust (stable) is preinstalled on ubuntu-latest runners — no third-party toolchain action needed.
      - name: Rust toolchain
        run: rustup show && cargo --version

      - name: System libraries (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Locked and hash-checked: a package swapped on PyPI at release time fails the install instead of
      # ending up in the shipped sidecar. Regenerate the lock with the command in requirements-release.in.
      - name: Python bridge deps + PyInstaller
        run: |
          python -m venv venv
          ./venv/bin/pip install --require-hashes --no-deps -r packaging/requirements-release.txt

      - name: Frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build the bridge sidecar
        run: bash scripts/build-sidecar.sh

      # Invoke the tauri CLI directly from the repo root (cwd) — `npm --prefix frontend run tauri` would
      # run it with cwd=frontend/, where the CLI can't locate the Tauri project (it panics in app_paths).
      # The .deb is required; the AppImage bundler (downloads linuxdeploy, relocates webkit + the sidecar)
      # is the fragile step, so it's best-effort and never loses the .deb.
      - name: Build the .deb bundle
        run: frontend/node_modules/.bin/tauri build --bundles deb --config src-tauri/tauri.bundle.conf.json

      - name: Build the AppImage bundle (best-effort)
        continue-on-error: true
        run: >-
          frontend/node_modules/.bin/tauri build --bundles appimage
          --config src-tauri/tauri.bundle.conf.json

      - name: Package firmware + flasher (ships with the release)
        run: zip -r marauder-firmware-cyd.zip firmware scripts/flash-firmware.sh requirements-flash.txt

      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist-artifacts/ \;
          cp marauder-firmware-cyd.zip dist-artifacts/
          ls -lh dist-artifacts/

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marauder-console-linux
          path: dist-artifacts/*

  publish:
    name: Attach to the GitHub release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the artifacts to the release; nothing else in this job needs it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: marauder-console-linux
          path: dist-artifacts

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Use the preinstalled gh CLI (no third-party release action). Create the release if it doesn't
        # exist yet, otherwise just attach/replace the files. GH_REPO is set because there's no checkout.
        run: |
          gh release create "$TAG" dist-artifacts/* --title "$TAG" --notes "Automated desktop bundle." \
            || gh release upload "$TAG" dist-artifacts/* --clobber
