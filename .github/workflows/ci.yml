name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    name: Bridge tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # All tests run against the mock serial source, so no hardware or serial device is needed.
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build  # tsc -b (typecheck) + vite build
        working-directory: frontend

  firmware-patches:
    name: Firmware patches apply
    runs-on: ubuntu-latest
    env:
      UPSTREAM_TAG: v1.20.0
      UPSTREAM_COMMIT: 511bb369
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Each opt-in patch in firmware/custom-*/ must apply to upstream v1.20.0 on its own and with all the
      # others, as the READMEs promise.
      - name: Fetch upstream ESP32 Marauder
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/justcallmekoko/ESP32Marauder "$RUNNER_TEMP/upstream"
          actual=$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)
          case "$actual" in
            "$UPSTREAM_COMMIT"*) ;;
            *) echo "::error::$UPSTREAM_TAG is $actual, expected $UPSTREAM_COMMIT"; exit 1 ;;
          esac
      - name: Check each patch, then all of them together
        run: |
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/firmware/custom-*/*.patch)
          [ ${#patches[@]} -gt 0 ] || { echo "::error::no patches found"; exit 1; }
          cd "$RUNNER_TEMP/upstream"
          for p in "${patches[@]}"; do
            git apply --check "$p"
            echo "ok: ${p#"$GITHUB_WORKSPACE"/}"
          done
          git apply "${patches[@]}"
          echo "ok: all ${#patches[@]} patches together"
