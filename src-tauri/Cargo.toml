[package]
name = "marauder-console"
version = "0.1.0"
description = "Desktop shell for Marauder Console (Tauri v2)"
edition = "2021"
rust-version = "1.77"
default-run = "marauder-console"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
